# =============================================================================
# NEXUS USER SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập User Service:
#   CSDL chính lưu trên Neon Cloud (PostgreSQL)
#   Hạ tầng phụ trợ (RabbitMQ, Redis) kết nối qua nexus-network
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng User Service RESTful Web API (Port 8001)
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-user-service
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${USER_CONNECTION_STRING:-${CONNECTION_STRING}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis:6379}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
