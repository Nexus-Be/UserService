# =============================================================================
# NEXUS USER SERVICE - INFRASTRUCTURE DOCKER COMPOSE
# =============================================================================
# Chỉ chạy 2 dịch vụ phụ trợ cục bộ: Redis Cache & RabbitMQ Broker
# CSDL chính lưu trên Neon Cloud: ep-still-glade...neon.tech
# =============================================================================

services:

  # 1. Redis Cache (Lưu OTP & Token Blacklist)
  user-cache:
    image: redis:7-alpine
    container_name: nexus-user-cache
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 2. RabbitMQ Message Broker (Bắn sự kiện)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

# 3. Backend User Service (.NET 8) - Setup sẵn để đóng gói
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-user-service
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__User=${RABBITMQ_USER}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    depends_on:
      - user-cache
      - rabbitmq
    restart: unless-stopped

networks:
  default:
    name: nexus-network
